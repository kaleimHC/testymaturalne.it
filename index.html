<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 'unsafe-inline' required: router uses inline <script> block and style attrs on parallax tiles -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
<title>Testy maturalne z informatyki — wybór stylu arkusza</title>
<meta name="description" content="Aplikacja do nauki teorii na maturę z informatyki. 105 pytań ABCD i Prawda/Fałsz z arkuszy CKE 2010–2025. Trzy warianty stylu: estetyczny, klasyczny, egzaminacyjny.">
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/mode-premium.png">
<link rel="prefetch" href="estetyczny/">
<link rel="prefetch" href="klasyczny/">
<link rel="prefetch" href="egzaminacyjny/">
<meta property="og:title" content="Testy maturalne z informatyki">
<meta property="og:description" content="105 pytań ABCD i Prawda/Fałsz z arkuszy CKE 2010–2025. Trzy warianty stylu arkusza. Zero instalacji.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <header class="topbar">
    <div class="brand">Wybierz styl arkusza</div>
    <div class="meta">
      Informatyka <span class="dot">·</span> <span id="q-count" style="white-space:nowrap">105 pytań</span>
    </div>
  </header>

  <main class="stage" id="stage">

    <a class="panel panel-1" href="estetyczny/">
      <div class="glow"></div>
      <div class="stagebox"><div class="bg"></div></div>
      <div class="label">
        <div class="row">
          <div class="num">- 01</div>
          <h2 class="title">Estetyczny</h2>
          <div class="subtitle">Oprawa miła dla oka</div>
        </div>
      </div>
    </a>

    <a class="panel panel-2" href="klasyczny/">
      <div class="glow"></div>
      <div class="stagebox"><div class="bg"></div></div>
      <div class="label">
        <div class="row">
          <div class="num">- 02</div>
          <h2 class="title">Klasyczny</h2>
          <div class="subtitle">Skupienie na treści</div>
        </div>
      </div>
    </a>

    <a class="panel panel-3" href="egzaminacyjny/">
      <div class="glow"></div>
      <div class="stagebox"><div class="bg"></div></div>
      <div class="label">
        <div class="row">
          <div class="num">- 03</div>
          <h2 class="title">Egzaminacyjny</h2>
          <div class="subtitle">Styl arkusza maturalnego</div>
        </div>
      </div>
    </a>

  </main>

</body>
</html>
